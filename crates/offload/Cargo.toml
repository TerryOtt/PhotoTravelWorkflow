[package]
name = "offload"
description = "End-of-day offload: four verified copies of a day's photographs"
version.workspace = true
edition.workspace = true
license.workspace = true

# Every entry here is used by code in the tree. The rest of the set decision 29 settles
# is declared in the workspace manifest and joins this list as the phase that needs it
# lands — a manifest full of dependencies nothing imports is not a plan, it is noise.
[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
geotag.workspace = true
console.workspace = true
indicatif.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
walkdir.workspace = true
windows.workspace = true

[features]
default = []
# Lets OFFLOAD_HASH swap the hash at runtime, for measuring what decision 17's choice
# costs. Off by default so the shipped binary carries SHA-256 and nothing else.
hash-experiments = ["dep:blake3", "dep:xxhash-rust"]

[dependencies.blake3]
workspace = true
optional = true

[dependencies.xxhash-rust]
workspace = true
optional = true

[dev-dependencies]
blake3.workspace = true
sha3.workspace = true
xxhash-rust.workspace = true
