# The half of the code quality gate a machine can check, run where it cannot be skipped.
#
# The pre-commit hook in .githooks/ runs the same three checks before a commit is made.
# This is not redundant with it: a hook can be bypassed with --no-verify, only exists on
# a clone that ran `git config core.hooksPath .githooks`, and never sees a pull request
# from a fork. This does.
#
# windows-latest, because Windows is the only platform this tool ships on -- the storage
# reasoning throughout docs/DESIGN.md is about NTFS, unbuffered Win32 I/O and volume
# identity, so testing somewhere the tool is never run would measure a configuration that
# does not occur.
#
# This costs nothing while the repository is public: Actions minutes are free and
# unlimited there on any standard GitHub-hosted runner. The Windows 2x minute multiplier
# applies only to *private* repos, which get 2,000 free minutes a month. If this repo is
# ever made private, that multiplier starts to matter and ubuntu-latest becomes the
# frugal choice -- and note rulesets need a paid plan at the same moment, so both bite
# together.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only ever reads the checkout.
permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # This name is the status check context named by the "main: require pull request"
    # ruleset. Renaming the job silently stops the gate from being enforced.
    name: fmt, clippy, test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # The lint LEVELS live in Cargo.toml's [workspace.lints] and are not restated here.
      # This line decides only what gets compiled: --all-targets so the tests and
      # examples/hash-rate.rs are linted at all, and --all-features so the
      # `hash-experiments` arms of hash::Hasher are compiled rather than exempt by accident.
      # Keep this identical to .githooks/pre-commit, or the hook and the gate disagree.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test

      # Python, under the same standing order as the Rust gate above: every language in a
      # project gets a best-of-breed linter at best-practice pedantry. The job NAME must
      # stay "fmt, clippy, test" -- the branch ruleset matches on it, and renaming it
      # silently stops the gate from being enforced -- so these arrive as extra steps.
      #
      # Both tools run and neither substitutes for the other: ruff checks that an
      # annotation EXISTS, pyright checks that it is TRUE.
      - name: Install ruff and pyright
        run: python -m pip install --upgrade ruff pyright

      - name: ruff
        run: ruff check scripts/

      - name: pyright
        run: pyright scripts/
